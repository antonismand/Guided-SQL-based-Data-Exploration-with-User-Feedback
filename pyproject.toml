[tool.poetry]
name = "querybuilder"
version = "1"
description = "Generate recommendations in SQL queries using Multi-Armed Bandits"
authors = [""]
packages = [
    { include = "querybuilder" },
    { include = "mabrecs" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^1.26.1"
fastapi = "^0.103.1"
uvicorn = "^0.23.2"
redis = "^5.0.1"
sentry-sdk = {extras = ["fastapi"], version = "^1.32.0"}
python-dotenv = "^1.0.0"
mo-sql-parsing = "^9.443.23275"
pandas = "^2.1.1"
requests = "^2.31.0"
pydantic-settings = "^2.0.3"



[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pre-commit = "^3.5.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
httpx = "^0.24.1"
poetry-plugin-up = "^0.4.0"


[tool.poetry.group.evaluation.dependencies]
pandas = "^2.1.1"
ipykernel = "^6.25.2"
matplotlib = "3.7"
tikzplotlib = "^0.10.1"
sqlparse = "^0.4.4"
tqdm = "^4.66.1"
pymongo = "^4.5.0"
seaborn = "^0.12.2"
sqlglot = "^18.16.1"
psycopg2 = "^2.9.9"
scikit-learn = "^1.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
